name: Release Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.2)'
        required: false
        default: 'v0.1.4'

# ── Code Signing Configuration ────────────────────────────────────────────────
# 100% Free Open-Source Code Signing:
#   Option A: SignPath Foundation (https://signpath.org/apply)
#     - SIGNPATH_API_TOKEN   — SignPath API token (Free for open source)
#     - SIGNPATH_ORG_ID      — SignPath Organization ID
#
#   Option B (Automated Fallback):
#     - Automatically signs binaries with Authenticode digital certificate
#       and DigiCert timestamp so executables have verified publisher structure.
#
#   Tauri Updater:
#     - TAURI_SIGNING_PRIVATE_KEY — Minisign private key for in-app updates
#     - TAURI_KEY_PASSWORD        — Minisign password (if set)

jobs:
  build-desktop-installers:
    name: Build Tauri v2 Installers (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: ''
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''

    runs-on: ${{ matrix.platform }}
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Desktop Icons
        run: node apps/desktop/scripts/generate-icons.cjs

      - name: Build Core Packages
        run: pnpm run build

      - name: Verify Web Dist Assets
        run: node -e "const fs = require('fs'); const p = 'apps/web/dist/index.html'; if (!fs.existsSync(p)) { console.error('Missing: ' + p); process.exit(1); } console.log('Verified web dist assets: ' + p);"

      - name: Build Tauri Desktop Package
        working-directory: apps/desktop
        run: pnpm exec tauri build

      - name: Upload Platform Release Assets
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.4' }}"
          name: "ProcessForge ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.4' }}"
          draft: false
          prerelease: false
          files: |
            apps/desktop/src-tauri/target/**/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/bundle/appimage/*.AppImage

      # ── Optional: SignPath Foundation Free OSS Signing ──────────────────────
      - name: Sign Windows Installer (SignPath Foundation - Free for OSS)
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORG_ID }}'
          project-slug: 'process-forge'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'installer'
          github-artifact-id: 'tauri-artifacts'
          wait-for-completion: true
          output-artifact-directory: 'signed-installer/'

      - name: Upload Signed Windows Installer
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.4' }}"
          files: signed-installer/*

  # ── Portable & Web Distribution Bundles ────────────────────────────────────
  publish-supplementary-bundles:
    name: Package Portable ZIP & Web Distribution
    runs-on: windows-latest
    needs: [build-desktop-installers]
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Packages & Web App
        run: pnpm run build

      - name: Package Portable ZIP & Web Distribution
        run: node apps/desktop/scripts/package-release-bundles.cjs

      - name: Upload Supplementary Release Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.4' }}"
          name: "ProcessForge ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.4' }}"
          draft: false
          prerelease: false
          files: |
            release-dist/process-forge-windows-portable-x64.zip
            release-dist/process-forge-web-dist.tar.gz
