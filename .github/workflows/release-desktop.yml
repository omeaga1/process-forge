name: Release Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1)'
        required: false
        default: 'v0.1.1'

jobs:
  build-desktop-installers:
    name: Build Tauri v2 Installers (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Desktop Icons
        run: node apps/desktop/scripts/generate-icons.cjs

      - name: Build Core Packages
        run: pnpm run build

      - name: Build Tauri Desktop Package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.1' }}
          releaseName: 'ProcessForge ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || ''v0.1.1'' }}'
          releaseBody: |
            Official ProcessForge Native Desktop Release for Windows (.exe installer & portable), macOS, and Linux.
            
            ### Included Artifacts
            - **Windows One-Click Installer**: `ProcessForge-Setup-x64.exe` (1-Click installer with desktop shortcut & start menu registration)
            - **Windows Portable Bundle**: `process-forge-windows-portable-x64.zip`
            - **Web Studio Distribution**: `process-forge-web-dist.tar.gz`
            - **Zero Raw Keys**: Strict Model Context Protocol (MCP) and OAuth 2.0 PKCE.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-standalone-packages:
    name: Package Windows One-Click Installer & Portable Bundles
    runs-on: windows-latest
    needs: [build-desktop-installers]
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Packages & Web App
        run: pnpm run build

      - name: Generate One-Click Installer and Portable Archives
        run: node apps/desktop/scripts/package-release-bundles.cjs

      - name: Upload Standalone Release Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.1' }}
          name: 'ProcessForge ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || ''v0.1.1'' }}'
          draft: false
          prerelease: false
          files: |
            release-dist/ProcessForge-Setup-x64.exe
            release-dist/process-forge-windows-portable-x64.zip
            release-dist/process-forge-web-dist.tar.gz
