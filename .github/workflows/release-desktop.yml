name: Release Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.2)'
        required: false
        default: 'v0.1.4'

# ── Code Signing Configuration ────────────────────────────────────────────────
# Windows Authenticode signing, through SignPath Foundation (free for open
# source; https://signpath.org/apply). Without these secrets the installers
# are published unsigned and Windows SmartScreen warns on first run.
#     - SIGNPATH_API_TOKEN   — API token of the SignPath CI user
#     - SIGNPATH_ORG_ID      — SignPath organization ID
# SignPath project 'process-forge', signing policy 'release-signing',
# artifact configuration 'installer' (a zip holding the NSIS .exe). See docs/ops/desktop-releases.md.
#
#   Tauri Updater:
#     - TAURI_SIGNING_PRIVATE_KEY — Minisign private key for in-app updates
#     - TAURI_KEY_PASSWORD        — Minisign password (if set)

jobs:
  build-desktop-installers:
    name: Build Tauri v2 Installers (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: ''
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''

    runs-on: ${{ matrix.platform }}
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Desktop Icons
        run: node apps/desktop/scripts/generate-icons.cjs

      - name: Build Core Packages
        run: pnpm run build

      # TAURI_SIGNING_PRIVATE_KEY must be present or `tauri build` emits no .sig
      # files, latest.json cannot be assembled, and the in-app updater stays
      # permanently blind. The pubkey baked into tauri.conf.json must be the
      # counterpart of this key.
      - name: Build Tauri Desktop Package
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The signing key is generated without a passphrase, so this resolves
          # to an empty string. rsign still wraps the key, and an empty password
          # is the correct one. The key's real protection is that it lives only
          # as a repository secret; a passphrase would only guard the file on a
          # developer's disk, and a mismatched one silently fails every release.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: pnpm exec tauri build

      - name: Verify Updater Artifacts Were Produced
        shell: bash
        run: |
          count=$(find apps/desktop/src-tauri/target/release/bundle -name '*.sig' | wc -l)
          echo "Found $count updater signature file(s)"
          find apps/desktop/src-tauri/target/release/bundle -name '*.sig' -print
          if [ "$count" -eq 0 ]; then
            echo "::error::No .sig files were produced. TAURI_SIGNING_PRIVATE_KEY is probably unset, so the in-app updater would never work. Refusing to publish a release that cannot be updated."
            exit 1
          fi

      # ── Windows code signing (SignPath) ─────────────────────────────────────
      # Must happen BEFORE the release upload and must be followed by a fresh
      # updater signature: the .sig made by `tauri build` covers the unsigned
      # installer, and the in-app updater rejects a file whose bytes changed.
      - name: Collect Windows installers for signing
        id: unsigned
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Sign Windows installers (SignPath Foundation)
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORG_ID }}'
          project-slug: 'process-forge'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'installer'
          github-artifact-id: '${{ steps.unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed-installer/'

      # Runs on every Windows release, signed or not, so the re-signing path
      # is exercised long before a certificate exists; unsigned, it simply
      # re-creates an equivalent signature.
      - name: Replace installers with signed ones and re-sign for the updater
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          nsis=apps/desktop/src-tauri/target/release/bundle/nsis
          if [ -d signed-installer ]; then
            find signed-installer -type f -print
            for f in $(find signed-installer -type f -name '*.exe'); do cp "$f" "$nsis/$(basename "$f")"; done
          else
            echo "No SignPath output: installers stay unsigned."
          fi
          for exe in "$nsis"/*.exe; do
            rm -f "$exe.sig"
            abs="$PWD/$exe"
            # -p explicitly: the key has an empty passphrase, and an empty env
            # var reads as absent, which would make the CLI prompt for one.
            (cd apps/desktop && pnpm exec tauri signer sign -p "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "$abs")
            test -s "$exe.sig" || { echo "::error::No updater signature for $exe after signing"; exit 1; }
          done
          # Proof in the log that Windows sees a valid signature.
          powershell -NoProfile -Command "Get-ChildItem '$nsis/*.exe' | Get-AuthenticodeSignature | Format-Table Status, SignerCertificate, Path -AutoSize"

      - name: Upload Platform Release Assets
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.4' }}"
          name: "ProcessForge ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.4' }}"
          draft: false
          prerelease: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/macos/*.sig
            apps/desktop/src-tauri/target/release/bundle/appimage/*.sig


  # The Tauri installer above is the only Windows download.

  # ── Updater manifest ────────────────────────────────────────────────────────
  # Publishes latest.json, which the in-app updater polls
  # (releases/latest/download/latest.json in tauri.conf.json). It runs after
  # every platform build so one manifest references all three.
  # The Claude Desktop extension (one-click install of the MCP server). One
  # file for every platform, attached to the release as process-forge.mcpb so
  # releases/latest/download/process-forge.mcpb always points at the newest.
  claude-desktop-extension:
    name: Build Claude Desktop extension (.mcpb)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Pack and validate the extension
        run: pnpm --filter @process-forge/mcp-server run pack:mcpb
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.4' }}"
          files: packages/mcp-server/build/process-forge.mcpb

  publish-updater-manifest:
    name: Publish latest.json
    needs: build-desktop-installers
    if: always() && needs.build-desktop-installers.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve Release Tag
        id: tag
        run: |
          TAG="${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}"
          if [ -z "$TAG" ]; then echo "::error::No release tag resolved"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" --dir assets --clobber
          ls -la assets

      # A signature is the literal contents of the .sig file. Each platform key
      # is matched by artifact shape rather than by a pinned filename, so a
      # version bump cannot silently drop a platform from the manifest.
      - name: Assemble latest.json
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { VERSION, TAG, REPO } = process.env;
          const base = `https://github.com/${REPO}/releases/download/${TAG}`;
          const files = fs.readdirSync('assets');

          const find = (re) => files.find((f) => re.test(f));
          const sigFor = (artifact) => {
            const sig = files.find((f) => f === `${artifact}.sig`);
            return sig ? fs.readFileSync(path.join('assets', sig), 'utf8').trim() : null;
          };

          const targets = {
            'windows-x86_64': find(/x64-setup\.exe$/),
            'darwin-aarch64': find(/\.app\.tar\.gz$/),
            'linux-x86_64': find(/\.AppImage$/)
          };

          const platforms = {};
          const missing = [];
          for (const [key, artifact] of Object.entries(targets)) {
            if (!artifact) { missing.push(`${key}: no artifact`); continue; }
            const signature = sigFor(artifact);
            if (!signature) { missing.push(`${key}: ${artifact} has no .sig`); continue; }
            platforms[key] = { signature, url: `${base}/${encodeURIComponent(artifact)}` };
          }

          if (Object.keys(platforms).length === 0) {
            console.error('::error::No signed artifacts found; latest.json would be useless.');
            console.error(missing.join('\n'));
            process.exit(1);
          }
          for (const m of missing) console.log(`::warning::${m}`);

          const manifest = {
            version: VERSION,
            notes: `ProcessForge ${TAG}`,
            pub_date: new Date().toISOString(),
            platforms
          };
          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
          console.log(JSON.stringify(manifest, null, 2));
          NODE

      - name: Attach latest.json to the Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: latest.json
