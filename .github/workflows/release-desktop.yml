name: Release Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

jobs:
  build-desktop-installers:
    name: Build Tauri v2 Installers (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Desktop Icons
        run: node apps/desktop/scripts/generate-icons.cjs

      - name: Build Core Packages
        run: pnpm run build

      - name: Build Tauri Desktop Package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name || inputs.tag || 'v0.1.0' }}
          releaseName: 'ProcessForge ${{ github.ref_name || inputs.tag || ''v0.1.0'' }}'
          releaseBody: |
            Official ProcessForge Native Desktop Release for Windows (.msi/.exe), macOS (.dmg), and Linux (.AppImage).
            
            ### Included Artifacts
            - **Windows**: `ProcessForge_${{ github.ref_name || inputs.tag || 'v0.1.0' }}_x64-setup.exe` and `.msi`
            - **macOS**: `ProcessForge_${{ github.ref_name || inputs.tag || 'v0.1.0' }}_aarch64.dmg`
            - **Linux**: `ProcessForge_${{ github.ref_name || inputs.tag || 'v0.1.0' }}_amd64.AppImage`
            - **Zero Raw Keys**: Built-in DPAPI keychain and local-first physics solver.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-standalone-packages:
    name: Package Portable Desktop Bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Packages & Web App
        run: pnpm run build

      - name: Generate Portable Release Archives
        run: |
          mkdir -p release-dist
          # Package web distribution
          tar -czf release-dist/process-forge-web-dist.tar.gz -C apps/web/dist .
          # Package windows portable bundle
          mkdir -p release-dist/process-forge-windows-portable
          cp -r apps/web/dist release-dist/process-forge-windows-portable/app
          cp apps/desktop/README.md release-dist/process-forge-windows-portable/
          cat << 'EOF' > release-dist/process-forge-windows-portable/Start-ProcessForge.bat
          @echo off
          echo Starting ProcessForge Industrial Studio...
          start "" "app\index.html"
          EOF
          (cd release-dist && zip -r process-forge-windows-portable-x64.zip process-forge-windows-portable)

      - name: Upload Standalone Release Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || inputs.tag || 'v0.1.0' }}
          name: 'ProcessForge ${{ github.ref_name || inputs.tag || ''v0.1.0'' }}'
          draft: false
          prerelease: false
          files: |
            release-dist/process-forge-windows-portable-x64.zip
            release-dist/process-forge-web-dist.tar.gz
