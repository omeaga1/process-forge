name: Simulation Engine & Protocol Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-simulation-suite:
    name: Typecheck, Physics & Convergence Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm run build

      - name: Typecheck Workspace
        run: pnpm run typecheck

      - name: Run Protocol & Simulation Test Suites
        run: pnpm run test

      # The npm package is one bundled file; check that it runs on its own
      # (MCP handshake over stdio, tools listed) before anyone publishes it.
      - name: Bundle & smoke-test the MCP server package
        run: pnpm --filter @process-forge/mcp-server run bundle && pnpm --filter @process-forge/mcp-server run smoke

      # The Claude Desktop extension: bundled with every dependency, manifest
      # built from the server's own tool list, checked by Anthropic's validator.
      - name: Pack and validate the Claude Desktop extension
        run: pnpm --filter @process-forge/mcp-server run pack:mcpb
