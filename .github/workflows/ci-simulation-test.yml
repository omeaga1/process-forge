name: Simulation Engine & Protocol Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-simulation-suite:
    name: Typecheck, Physics & Convergence Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm run build

      - name: Typecheck Workspace
        run: pnpm run typecheck

      - name: Run Protocol & Simulation Test Suites
        run: pnpm run test
