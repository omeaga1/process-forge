name: Desktop Shell

# Compiles and tests the Rust shell on every pull request that touches it.

on:
  push:
    branches: [main]
    paths: ['apps/desktop/**', '.github/workflows/ci-desktop.yml']
  pull_request:
    branches: [main]
    paths: ['apps/desktop/**', '.github/workflows/ci-desktop.yml']

jobs:
  rust:
    name: Rust check & tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri::generate_context! embeds the frontend at compile time and fails
      # if frontendDist does not exist. The shell's own code does not depend on
      # what is in it, so an empty page is enough to compile against.
      - name: Stub the frontend bundle
        run: mkdir -p apps/web/dist && echo '<!doctype html>' > apps/web/dist/index.html

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # TEMPORARY: capture the lockfile this run resolved so it can be committed.
      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: error
