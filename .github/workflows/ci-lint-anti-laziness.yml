name: Anti-Laziness & Scaffold Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-anti-laziness:
    name: AST Scan for Untracked Scaffolding & Placeholders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Scaffold Registry CLI
        run: pnpm --filter @process-forge/scaffold-registry run build

      - name: Execute Anti-Laziness Verification
        run: pnpm run verify:scaffolds
