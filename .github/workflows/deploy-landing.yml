name: Deploy Showcase Landing & Web Studio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/docs-landing/**'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core Monorepo Packages
        run: pnpm run build

      - name: Build Web Studio for Subpath
        run: pnpm --filter @process-forge/web build
        env:
          VITE_BASE_PATH: /process-forge/studio/

      - name: Build Showcase Landing Page
        run: pnpm --filter @process-forge/docs-landing build
        env:
          VITE_BASE_PATH: /process-forge/

      - name: Bundle Web Studio into Landing Distribution
        run: |
          mkdir -p apps/docs-landing/dist/studio
          cp -r apps/web/dist/* apps/docs-landing/dist/studio/
          touch apps/docs-landing/dist/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs-landing/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
