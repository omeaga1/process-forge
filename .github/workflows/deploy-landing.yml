name: Deploy Showcase Landing & Web Studio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/docs-landing/**'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core Monorepo Packages
        run: pnpm run build

      - name: Build Showcase Landing Page
        run: pnpm --filter @process-forge/docs-landing build
        env:
          VITE_BASE_PATH: /process-forge/

      - name: Create Web Studio Redirect to Cloudflare Pages
        run: |
          mkdir -p apps/docs-landing/dist/studio
          cat << 'EOF' > apps/docs-landing/dist/studio/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0; url=https://process-forge.pages.dev/" />
              <script>window.location.href = "https://process-forge.pages.dev/";</script>
              <title>Redirecting to ProcessForge Studio...</title>
            </head>
            <body>
              <p>Redirecting to ProcessForge Studio at <a href="https://process-forge.pages.dev/">https://process-forge.pages.dev/</a>...</p>
            </body>
          </html>
          EOF
          touch apps/docs-landing/dist/.nojekyll

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/docs-landing/dist
          publish_branch: gh-pages
          cname: ''
