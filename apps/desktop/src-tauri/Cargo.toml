[package]
name = "process-forge-desktop"
version = "0.1.2"
description = "ProcessForge Desktop native shell"
authors = ["omeaga1"]
license = "Apache-2.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
